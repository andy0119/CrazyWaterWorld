<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極光助手｜重建版</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,'Microsoft JhengHei',sans-serif;background:#f5f7fc;color:#202b43}header{background:#fff;border-bottom:1px solid #e6eaf5;padding:20px max(20px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}main{max-width:1080px;margin:35px auto;padding:0 20px}.card{background:white;border:1px solid #e7ebf4;border-radius:18px;padding:24px;box-shadow:0 10px 30px #25304a0a;margin-bottom:18px}.auth{max-width:430px;margin:9vh auto}input,select{border:1px solid #d8deeb;border-radius:9px;padding:12px;width:100%;font:inherit;margin:7px 0 13px}button{border:0;background:#5b6cf9;color:white;padding:11px 18px;border-radius:10px;cursor:pointer;font:inherit}button.secondary{background:#edf0ff;color:#4454c8}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:#77839a;font-size:13px}.notice{background:#fff6dd;padding:13px;border-radius:9px;color:#745713}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #edf0f6}#msg{white-space:pre-wrap;color:#a3414d;min-height:24px}@media(max-width:650px){.row{display:block}td,th{padding:7px;font-size:12px}}
</style></head><body><header><h1>✦ 極光助手 <small class="muted">Rebuild v0.1</small></h1><button class="secondary hidden" id="logout" onclick="signout()">登出</button></header><main><section id="auth" class="card auth"><h2>平台帳號</h2><p class="muted">使用新建的本機後端帳號；不會連線原平台。</p><input id="username" autocomplete="username" placeholder="帳號（至少 3 字）"><input id="password" type="password" autocomplete="current-password" placeholder="密碼（至少 8 字）"><div class="row"><button onclick="authenticate('login')">登入</button><button class="secondary" onclick="authenticate('register')">註冊</button></div><p id="msg"></p></section><section id="dashboard" class="hidden"><div class="card"><h2>控制台</h2><p id="welcome"></p><div class="notice">目前為可運作的帳號與資料管理 MVP。啟動／停止僅變更資料庫狀態，尚未控制遊戲、手機或 Kubernetes。</div></div><div class="card"><h2>綁定遊戲帳號資料</h2><div class="row"><input id="gameuser" placeholder="遊戲帳號名稱"><input id="nickname" placeholder="角色暱稱"></div><div class="row"><input id="server" placeholder="伺服器名稱"><select id="platform"><option value="app">APP</option><option value="qq">QQ</option><option value="alipay">支付寶</option><option value="douyin">抖音</option></select></div><button onclick="bindGame()">新增綁定資料</button><p class="muted">此版本不收集或保存遊戲密碼、遊戲 Token，也不驗證遊戲登入。</p></div><div class="card"><h2>已綁定帳號</h2><div style="overflow-x:auto"><table><thead><tr><th>帳號</th><th>暱稱</th><th>伺服器</th><th>狀態</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></div></div><p id="actionmsg" class="muted"></p></section></main><script>
let token=sessionStorage.getItem('aurora_token')||'';const $=id=>document.getElementById(id);async function api(path,method='GET',body){let res=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});let data=await res.json();if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:'操作失敗');return data}
async function authenticate(mode){$('msg').textContent='';try{let credentials={username:$('username').value.trim(),password:$('password').value};if(mode==='register'){await api('/api/auth/register','POST',credentials);$('msg').style.color='#19825c';$('msg').textContent='註冊成功，請按登入';return}let r=await api('/api/auth/login','POST',credentials);token=r.token;sessionStorage.setItem('aurora_token',token);await load()}catch(e){$('msg').style.color='#a3414d';$('msg').textContent=e.message}}
function signout(){token='';sessionStorage.removeItem('aurora_token');$('dashboard').classList.add('hidden');$('auth').classList.remove('hidden');$('logout').classList.add('hidden')}
async function load(){try{let user=await api('/api/user/me');$('welcome').textContent='登入帳號：'+user.username;$('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await refresh()}catch(e){signout()}}
async function refresh(){let r=await api('/api/user/sub-users');let tbody=$('accounts');tbody.replaceChildren();for(let x of r.data){let tr=document.createElement('tr');for(let k of ['username','nickname','server_name','status']){let td=document.createElement('td');td.textContent=x[k]||'—';tr.appendChild(td)}let td=document.createElement('td');for(let [label,action] of [['啟動示範','run'],['停止','stop']]){let b=document.createElement('button');b.className=action==='stop'?'secondary':'';b.textContent=label;b.style.margin='3px';b.onclick=()=>control(x.id,action);td.appendChild(b)}tr.appendChild(td);tbody.appendChild(tr)}if(!r.data.length){let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='尚未新增帳號';tr.appendChild(td);tbody.appendChild(tr)}}
async function bindGame(){try{let r=await api('/api/sub-user/bind','POST',{username:$('gameuser').value.trim(),nickname:$('nickname').value,server_name:$('server').value,platform:$('platform').value});$('actionmsg').textContent=r.message;await refresh()}catch(e){$('actionmsg').textContent=e.message}}
async function control(id,action){try{let r=await api('/api/kubernetes/'+action,'POST',{id});$('actionmsg').textContent=r.message;await refresh()}catch(e){$('actionmsg').textContent=e.message}}
if(token)load();</script></body></html>
