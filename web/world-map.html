<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瘋狂水世界 · 世界地圖</title><style>body{margin:0;font:15px system-ui;background:#102236;color:#e6f0fb}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#9bd7ff}button,input{font:inherit;border:1px solid #7795b0;border-radius:7px;padding:7px;background:#eef6ff;color:#142c45}main{display:grid;grid-template-columns:1fr 270px;height:calc(100vh - 120px);min-height:400px;gap:12px;padding:0 16px}svg{width:100%;height:100%;background:radial-gradient(ellipse,#1c4b6a,#102d48);border:1px solid #53748c;border-radius:12px;touch-action:none;cursor:grab}svg:active{cursor:grabbing}aside{padding:14px;background:#19334d;border-radius:12px;overflow:auto}#status{padding:0 16px 12px;color:#bfd2e1}.city{cursor:pointer}.city:hover circle{stroke:#fff;stroke-width:12}small{display:block;color:#bad1df;margin-top:12px}#info{white-space:pre-line;line-height:1.7}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}svg{height:65vh}aside{min-height:120px}}</style></head><body><header><a id="back" href="/">‹ 主頁</a><strong>普通世界地圖</strong><input id="search" placeholder="搜尋城池名稱或 ID" aria-label="搜尋城池"><button id="find">搜尋</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="縮小">－</button><button id="fit">全圖</button><button id="refresh">更新快取</button><button id="connectMap">連線讀取地圖</button></header><p id="status" role="status">載入城池位置…</p><main><svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可拖曳縮放的普通世界城池與艦隊地圖"></svg><aside><strong>城池／艦隊資訊</strong><div id="info">點選城池查看資料。</div><small>城池顏色：聯盟編號<br>黃色三角：自己的艦隊（行軍位置依伺服器起迄時間估算）<br>藍色三角：其他玩家艦隊<br>虛線：艦隊目標方向</small><small>其他玩家僅顯示伺服器目前回傳／推送的區域，並非全服全圖監控。這是資料地圖，不是遊戲畫面。地形、海盜與資源點尚未呈現。位置與歸屬以腳本最近讀取資料為準；未更新時顯示快取時間。</small></aside></main><script src="/world-map.js?v=5"></script></body></html>
