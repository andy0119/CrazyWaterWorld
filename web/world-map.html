<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瘋狂水世界 · 世界地圖</title><style>body{margin:0;font:15px system-ui;background:#102236;color:#e6f0fb}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#9bd7ff}button,input{font:inherit;border:1px solid #7795b0;border-radius:7px;padding:7px;background:#eef6ff;color:#142c45}main{display:grid;grid-template-columns:1fr 270px;height:calc(100vh - 120px);min-height:400px;gap:12px;padding:0 16px}svg{width:100%;height:100%;background:radial-gradient(ellipse,#1c4b6a,#102d48);border:1px solid #53748c;border-radius:12px;touch-action:none;cursor:grab}svg:active{cursor:grabbing}aside{padding:14px;background:#19334d;border-radius:12px;overflow:auto}#status{padding:0 16px 12px;color:#bfd2e1}.city{cursor:pointer}.city:hover circle{stroke:#fff;stroke-width:12}small{display:block;color:#bad1df;margin-top:12px}#info{white-space:pre-line;line-height:1.7}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}svg{height:65vh}aside{min-height:120px}}.wm-layers{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}.wm-chip{border-radius:18px;background:#19334d;color:#b9cce0;cursor:pointer}.wm-chip.on{background:#1677ff;color:#fff;border-color:#1677ff}.wm-obj{cursor:pointer}.wm-obj:hover{filter:brightness(1.4)}.wm-legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px}.wm-legend span{display:inline-flex;gap:6px;align-items:center;font-size:12px}.wm-legend i{display:inline-block;width:10px;height:10px;border-radius:2px}main{height:calc(100vh - 210px)}#shipList{display:grid;gap:6px;margin:10px 0 16px}#shipList button{text-align:left;cursor:pointer;background:#244a6b;color:#fff;font-size:13px}.ship-list-panel{margin:12px 0}</style></head><body><header><a id="back" href="/">‹ 主頁</a><strong>普通世界地圖</strong><input id="search" placeholder="搜尋城池名稱或 ID" aria-label="搜尋城池"><button id="find">搜尋</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="縮小">－</button><button id="fit">全圖</button><button id="home">定位我方</button><button id="refresh">更新快取</button><button id="connectMap">連線讀取地圖</button></header><div id="layers" class="wm-layers"></div><p id="status" role="status">載入城池位置…</p><main><svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可拖曳縮放的普通世界城池與艦隊地圖"></svg><aside><strong>地圖物件資訊</strong><details open class="ship-list-panel"><summary>貨輪清單 · 點選定位</summary><div id="shipList"></div></details><div id="info">點選城池、艦隊、貨輪或芯片礦查看資料。</div><small>城池顏色：聯盟編號<br>艦隊與行軍虛線：所屬聯盟顏色，未確認為灰色<br>白邊三角：我方艦隊；深邊：其他玩家<br>行軍位置依伺服器起迄時間估算</small><small>貨輪方塊：聯盟顏色；下方藍條為進度，藍點表示我方艦隊。菱形為芯片礦。<br>資料來自伺服器最近回覆與推送；只顯示已取得的區域，過期資料以物件時間為準。</small></aside></main><div id="legend" class="wm-legend"></div><script src="/world-map.js?v=9"></script></body></html>
